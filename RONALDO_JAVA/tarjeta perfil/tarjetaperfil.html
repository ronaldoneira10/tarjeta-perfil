<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.18.1/axios.js"></script>
    <title>Document</title>
    <style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background: #f4f6f9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px;
}

div{
    width: 650px;
    background: #fff;
    border-radius: 18px;
    padding: 35px;
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
    border-top: 6px solid #080808;
}

#perfil{
    display: block;
    width: 170px;
    height: 170px;
    margin: auto;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid #000000;
    margin-bottom: 20px;
}

#nombre{
    text-align: center;
    font-size: 32px;
    color: #222;
    margin-bottom: 30px;
}

h3{
    background: #fafafa;
    border: 1px solid #e5e7eb;
    border-left: 5px solid #0c0c0c;
    padding: 14px 18px;
    margin: 10px 0;
    border-radius: 10px;
    color: #444;
    font-size: 16px;
    word-break: break-word;
   
}

h3:hover{
    background: #f1f5ff;
    border-left: 5px solid #ff0101;
    transform: translateX(6px);
}

img{
    transition: .3s;
}

img:hover{
    transform: scale(1.04);
}




    </style>
</head>

<body>
    <div>

        <h1 id="nombre"></h1>
        <img id="perfil" alt="">
        <h3 id="correo"></h3>
        <h3 id="telefono"></h3>
        <h3 id="pais"></h3>
        <h3 id="fecha"></h3>
        <h3 id="edad"></h3>
        <h3 id="genero"></h3>
        <h3 id="ciudad"></h3>
        <h3 id="estado"></h3>
        <h3 id="codigo"></h3>
        <h3 id="calle"></h3>
        <h3 id="numero"></h3>
        <h3 id="latitud"></h3>
        <h3 id="longitud"></h3>
        <h3 id="zona_horaria"></h3>
        <h3 id="descripcion"></h3>
        <h3 id="desplazamiento"></h3>
        <h3 id="md5"></h3>
        <h3 id="contrasena"></h3>
        <h3 id="sal"></h3>
        <h3 id="sha1"></h3>
        <h3 id="sha256"></h3>
        <h3 id="nombre_usuario"></h3>
        <h3 id="uuid"></h3>
        <h3 id="titulo"></h3>
        <h3 id="nat"></h3>

       
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {


            let res = await axios.get("https://randomuser.me/api/")
            console.log(res);

            let nombre = document.getElementById("nombre");
            nombre.textContent = res.data.results[0].name.first + " " + res.data.results[0].name.last;

            let perfil = document.getElementById("perfil")
            perfil.src = res.data.results[0].picture.large

            let correo = document.getElementById("correo")
            correo.textContent = "Correo: " + res.data.results[0].email;

            let telefono = document.getElementById("telefono")
            telefono.textContent = "Telefono: " + res.data.results[0].phone;

            let pais = document.getElementById("pais")
            pais.textContent = " Pais: " + res.data.results[0].location.country;

            let fecha = document.getElementById("fecha");
            fecha.textContent = "Fecha Nacimiento: " + new Date(res.data.results[0].dob.date).toLocaleDateString();

            let edad = document.getElementById("edad");
            edad.textContent = "Edad: " + res.data.results[0].dob.age;

            let genero = document.getElementById("genero");
            genero.textContent = "Genero: " + res.data.results[0].gender;

            let ciudad = document.getElementById("ciudad");
            ciudad.textContent = "Ciudad: " + res.data.results[0].location.city;

            let estado = document.getElementById("estado");
            estado.textContent = "Estado: " + res.data.results[0].location.state;

            let codigo = document.getElementById("codigo");
            codigo.textContent = "Codigo postal: " + res.data.results[0].location.postcode;

            let calle = document.getElementById("calle");
            calle.textContent = "Calle: " + res.data.results[0].location.street.name;

            let numero = document.getElementById("numero");
            numero.textContent = "Numero de calle: " + res.data.results[0].location.street.number;

            let latitud = document.getElementById("latitud");
            latitud.textContent = "latitud: " + res.data.results[0].location.coordinates.latitude;

            let longitud = document.getElementById("longitud");
            longitud.textContent = "longitud:" + res.data.results[0].location.coordinates.longitude;

            let zona_horaria = document.getElementById("zona_horaria");
            zona_horaria.textContent = "Zona horaria: " + res.data.results[0].location.timezone.description;

            let descripcion = document.getElementById("descripcion");
            descripcion.textContent = "Descripcion: " + res.data.results[0].location.timezone.description;

            let desplazamiento = document.getElementById("desplazamiento");
            desplazamiento.textContent = " Desplazamiento: " + res.data.results[0].location.timezone.offset;


            let md5 = document.getElementById("md5");
            md5.textContent = "Usuario login: " + res.data.results[0].login.md5;

            let contrasena = document.getElementById("contrasena");
            contrasena.textContent = "Contraseña: " + res.data.results[0].login.password;

            let sal = document.getElementById("sal");
            sal.textContent = "Sal: " + res.data.results[0].login.salt;

            let sha1 = document.getElementById("sha1");
            sha1.textContent = "SHA-1: " + res.data.results[0].login.sha1;

            let sha256 = document.getElementById("sha256");
            sha256.textContent = "SHA-256: " + res.data.results[0].login.sha256;

            let nombre_usuario = document.getElementById("nombre_usuario");
            nombre_usuario.textContent = "Nombre de usuario: " + res.data.results[0].login.username;

            let uuid = document.getElementById("uuid");
            uuid.textContent = "UUID: " + res.data.results[0].login.uuid;

            let titulo = document.getElementById("titulo");
            titulo.textContent = "Titulo: " + res.data.results[0].name.title;

            let nat = document.getElementById("nat");
            nat.textContent = "NAT: " + res.data.results[0].nat;

        })

    </script>

</body>

</html>
